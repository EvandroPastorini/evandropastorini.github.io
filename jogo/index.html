<!doctype html>
<html lang="pt-BR" data-versao="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Qual é o Filme?">
<meta name="theme-color" content="#1a0606">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<title>Qual é o Filme?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=VT323&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Identidade "Locadora" — ver identidade/locadora.html */
  :root {
    --fita: #121212; --capa: #1E1E1E; --capa-2: #2A2A2A; --linha: #333333;
    --etiqueta: #F4F1DE; --apagado: #9A978A;
    --vermelho: #E63946; --laranja: #F77F00; --amarelo: #FCBF49; --verde: #2EC4B6;
    --display: Righteous, "DM Sans", sans-serif;
    --vcr: VT323, ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fita); color: var(--etiqueta);
    font: 16px/1.5 "DM Sans", system-ui, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }

  .stripes { display: flex; flex-direction: column; gap: 3px; }
  .stripes i { display: block; height: 5px; }
  .stripes i:nth-child(1) { background: var(--vermelho); }
  .stripes i:nth-child(2) { background: var(--laranja); }
  .stripes i:nth-child(3) { background: var(--amarelo); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 14px; }
  h1 { font: 24px/1 var(--display); margin: 0; }
  h1 span { color: var(--amarelo); }
  .chips { display: flex; gap: 6px; }
  .chip { font: 19px/1 var(--vcr); background: var(--capa-2); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .chip.gold { color: var(--amarelo); }
  .label { font: 18px/1 var(--vcr); color: var(--apagado); letter-spacing: .5px; }

  /* TV / frame */
  .scene { position: relative; aspect-ratio: 16/9; border: 3px solid var(--etiqueta); border-radius: 10px; overflow: hidden;
    background: #24303f; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 16px; }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scene .emoji { font-size: 60px; line-height: 1; }
  .scene .cap { margin-top: 10px; font-size: 15px; max-width: 32ch; }
  .osd { position: absolute; z-index: 2; font: 22px/1 var(--vcr); color: #fff; text-shadow: 1px 1px 0 #000; }
  .osd.tl { top: 8px; left: 10px; } .osd.tr { top: 8px; right: 10px; } .osd.bl { bottom: 8px; left: 10px; }
  .osd.err { color: var(--vermelho); }
  .osd.br { bottom: 8px; right: 10px; }
  .osd.lanc { color: var(--fita); background: var(--amarelo); padding: 2px 6px 0; border-radius: 4px; text-shadow: none; font-size: 19px; }
  /* Combo: cada nível maior, mais quente e mais barulhento */
  .combo { margin: 12px auto 4px; }
  .combo-n { font: 40px/1 var(--display); letter-spacing: 1px; animation: comboIn .5s cubic-bezier(.2,1.8,.4,1) .15s both; }
  .combo-msg { font: 24px/1.1 var(--display); margin: 6px 0 2px; }
  .combo-bonus { font: 20px/1 var(--vcr); color: var(--verde); margin-top: 6px; }
  .combo.c2 .combo-n { color: var(--laranja); }
  .combo.c3 .combo-n { color: var(--vermelho); font-size: 46px; text-shadow: 0 0 18px rgba(230,57,70,.6); }
  .combo.c4 .combo-n { color: var(--amarelo); font-size: 52px; text-shadow: 0 0 26px rgba(252,191,73,.85); }
  .combo.c5 .combo-n { font-size: 58px; color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, var(--vermelho), var(--laranja), var(--amarelo), var(--verde), var(--vermelho)); background-size: 200% 100%;
    animation: comboIn .5s cubic-bezier(.2,1.8,.4,1) .15s both, arco 1.2s linear infinite; }
  .combo.c4, .combo.c5 { animation: tremor .35s ease-in-out .5s 3; }
  @keyframes comboIn { from { transform: scale(2.6) rotate(-8deg); opacity: 0; } }
  @keyframes arco { to { background-position: 200% 0; } }
  @keyframes tremor { 25% { transform: translate(-4px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, -1px); } }
  .combo-quebrado { color: var(--apagado); font: 18px/1 var(--vcr); margin: 8px 0 12px; }
  @media (prefers-reduced-motion: reduce) { .combo, .combo-n, .combo.c5 .combo-n { animation: none; } }
  .chutes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chutes:empty { display: none; }
  .chutes span { font: 18px/1 var(--vcr); color: var(--vermelho); background: var(--fita); border: 1px solid var(--linha);
    padding: 5px 8px; border-radius: 6px; text-decoration: line-through; text-decoration-thickness: 1px; }
  .colecao { text-align: left; margin-top: 10px; font: 18px/1.2 var(--vcr); color: var(--apagado); }
  .colecao .barra { height: 8px; border-radius: 4px; background: var(--fita); border: 1px solid var(--linha); margin-top: 5px; overflow: hidden; }
  .colecao .barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--vermelho), var(--laranja), var(--amarelo)); }
  .scene.tracking > img { animation: troca .3s ease-out both; }
  @keyframes troca { from { opacity: 0; } }
  .scene.shake { animation: shake .35s ease-in-out; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  .dots { display: flex; gap: 6px; margin: 12px 0; }
  .dot { flex: 1; height: 34px; border-radius: 8px; border: 1.5px solid var(--linha);
    background: var(--capa); color: var(--apagado); font: 20px/1 var(--vcr); cursor: pointer; }
  .dot.seen { color: var(--etiqueta); }
  .dot.active { border-color: var(--amarelo); color: var(--amarelo); }
  .dot.bad { background: var(--vermelho); color: var(--fita); border-color: transparent; }
  .dot.skip { background: var(--laranja); color: var(--fita); border-color: transparent; }
  .dot.ok { background: var(--verde); color: var(--fita); border-color: transparent; }
  .dot:disabled { cursor: default; opacity: .45; }

  .pts { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .pts b { font: 34px/1 var(--display); color: var(--amarelo); font-weight: 400; }

  .guess { position: relative; }
  input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--linha);
    background: var(--capa); color: var(--etiqueta); font: inherit; }
  input:focus, textarea:focus { outline: none; border-color: var(--amarelo); }
  input::placeholder, textarea::placeholder { color: var(--apagado); }
  textarea { min-height: 90px; resize: vertical; }
  .list { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin: 4px 0 0; padding: 4px;
    list-style: none; background: var(--capa-2); border: 1.5px solid var(--linha); border-radius: 10px;
    max-height: 220px; overflow: auto; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  .list li { padding: 9px 10px; border-radius: 6px; cursor: pointer; }
  .list li:hover, .list li.hl { background: var(--fita); color: var(--amarelo); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button.btn { flex: 1; padding: 13px; border-radius: 10px; border: 0; font: 18px/1 var(--display); cursor: pointer; }
  .primary { background: var(--amarelo); color: var(--fita); }
  .ghost { background: transparent; color: var(--etiqueta); border: 1.5px solid var(--linha) !important; }
  .btn:disabled { opacity: .4; cursor: default; }
  button:focus-visible, .dot:focus-visible { outline: 2px solid var(--amarelo); outline-offset: 2px; }

  .panel { background: var(--capa); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; margin-top: 14px; }
  .panel h2 { font: 22px/1.15 var(--display); margin: 0 0 4px; font-weight: 400; }
  .muted { color: var(--apagado); font-size: 14px; }
  .center { text-align: center; }
  .stamp { display: inline-block; transform: rotate(-6deg); border: 2.5px solid currentColor; font: 22px/1 var(--display);
    padding: 6px 14px; border-radius: 8px; margin: 26px 0 16px; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; }
  .stamp.ok { color: var(--verde); } .stamp.bad { color: var(--vermelho); }
  @keyframes stamp { from { transform: rotate(-20deg) scale(1.6); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
  .answer { font: 26px/1.1 var(--display); } .answer small { font: 16px "DM Sans"; color: var(--apagado); }
  .counter { text-align: right; font: 17px var(--vcr); color: var(--apagado); margin-top: 4px; }
  .big { font: 64px/1 var(--display); color: var(--amarelo); } .big small { font-size: 22px; color: var(--apagado); }
  pre.share { text-align: left; white-space: pre-wrap; background: var(--fita); padding: 12px; border-radius: 10px; font: 20px/1.3 var(--vcr); margin: 14px 0 0; }
  .hidden { display: none !important; }
  body.com-anuncio { padding-bottom: calc(var(--banner, 60px) + 8px); }
  body.com-anuncio .ad, html[data-versao="web"] .ad { display: none; }
  body.com-anuncio .folha { bottom: var(--banner, 60px); }
  .ad { margin-top: 18px; border: 1.5px dashed var(--linha); border-radius: 10px; padding: 10px; text-align: center; font: 17px var(--vcr); color: var(--apagado); }
  /* ===== "Consegui!": acerto, sequência, patente ===== */
  .scene.win { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde), 0 0 40px rgba(46,196,182,.55); }
  .scene.win::before { content: ""; position: absolute; inset: 0; z-index: 3; background: #fff; pointer-events: none;
    animation: flash .5s ease-out forwards; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .osd.win { color: var(--verde); }
  .pts .worthBox.drop { animation: drop .45s ease-out; }
  @keyframes drop { 0% { color: var(--vermelho); transform: scale(1.25); } 100% { transform: scale(1); } }
  .streakTag { color: var(--laranja); margin-left: 8px; }
  .win-box { margin: 18px 0 8px; }
  .win-box .stamp { margin: 0 0 10px; }
  .gain { font: 76px/1 var(--display); color: var(--amarelo); text-shadow: 0 0 24px rgba(252,191,73,.45); }
  .gain.pop { animation: pop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .chip.bump { animation: bump .5s ease-out; }
  @keyframes bump { 30% { transform: scale(1.3); background: var(--amarelo); color: var(--fita); } }
  .strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 14px 0 6px; }
  .strip figure { margin: 0; position: relative; aspect-ratio: 16/9; border-radius: 5px; overflow: hidden; border: 2px solid var(--linha);
    background: var(--capa); animation: stripIn .3s ease-out both; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip figure.ok { border-color: var(--verde); } .strip figure.bad { border-color: var(--vermelho); } .strip figure.skip { border-color: var(--laranja); }
  .strip figure.extra img { filter: grayscale(1) brightness(.55); }
  .strip figure span { position: absolute; left: 3px; top: 2px; font: 15px/1 var(--vcr); color: #fff; text-shadow: 1px 1px 0 #000; }
  @keyframes stripIn { from { opacity: 0; transform: translateY(8px); } }
  .confete { position: fixed; top: -12px; z-index: 90; width: 9px; height: 15px; border-radius: 2px; pointer-events: none; }
  .patente { display: inline-block; margin: 6px 0 4px; padding: 6px 12px; border-radius: 8px; font: 22px/1 var(--vcr); letter-spacing: 1px;
    background: var(--fita); border: 2px solid currentColor; }
  .recorde { color: var(--verde); font: 20px/1 var(--vcr); margin-top: 6px; }
  /* ===== Telas: início, caminho, barra da partida ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -4px 0 12px; }
  .voltar { background: none; border: 0; color: var(--apagado); font: 20px/1 var(--vcr); padding: 6px 0; cursor: pointer; }
  .voltar:hover { color: var(--etiqueta); }
  .tagline { margin: 4px 0 18px; color: var(--apagado); font: 20px/1.2 var(--vcr); }
  .cartao { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; margin-bottom: 14px; padding: 18px;
    border-radius: 16px; border: 2px solid var(--verde); background: var(--capa); color: var(--etiqueta); cursor: pointer;
    box-shadow: 0 5px 0 #1a7f75; font: inherit; }
  .cartao:active { transform: translateY(3px); box-shadow: 0 2px 0 #1a7f75; }
  .cartao.rapida { border-color: var(--amarelo); box-shadow: 0 5px 0 #a47a1f; }
  .cartao.rapida:active { box-shadow: 0 2px 0 #a47a1f; }
  .cartao-topo { display: flex; align-items: center; gap: 12px; }
  .cartao-icone { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--verde); color: var(--fita); }
  .cartao.rapida .cartao-icone { background: var(--amarelo); }
  .cartao-icone svg { width: 28px; height: 28px; }
  .cartao-nome { font: 34px/1 var(--display); color: var(--verde); }
  .cartao.rapida .cartao-nome { color: var(--amarelo); }
  .cartao-desc { font-size: 16px; line-height: 1.35; color: var(--etiqueta); margin: 4px 0 2px; }
  .cartao-status { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; margin-top: 4px; border-top: 1px dashed var(--linha); color: var(--apagado); font-size: 14px; }
  .cartao .cta { align-self: flex-end; font: 22px/1 var(--vcr); color: var(--verde); margin-top: 4px; }
  .cartao.rapida .cta { color: var(--amarelo); }
  .cartao .barra, .colecao .barra { display: block; height: 8px; border-radius: 4px; background: var(--fita); border: 1px solid var(--linha); overflow: hidden; }
  .cartao .barra i { display: block; height: 100%; background: var(--verde); }
  .link { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--apagado); font: 18px var(--vcr); text-decoration: underline; cursor: pointer; }

  /* Caminho da carreira (estilo trilha) */
  .unidade { margin-bottom: 26px; }
  .unidade-banner { background: var(--cor); color: var(--fita); border-radius: 14px; padding: 12px 16px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .unidade-banner .label { color: var(--fita); opacity: .75; }
  .unidade-banner h2 { font: 22px/1.1 var(--display); margin: 3px 0 2px; }
  .unidade-banner div:last-child { font-size: 14px; opacity: .85; }
  .unidade.trancada .unidade-banner { background: var(--capa-2); color: var(--apagado); }
  .unidade.trancada .unidade-banner .label { color: var(--apagado); }
  .nos { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 58px 0 4px; }
  .no-wrap { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x)); }
  .no { width: 76px; height: 70px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: var(--cor); color: var(--fita); box-shadow: 0 7px 0 rgba(0,0,0,.45); position: relative; }
  .no:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .no svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .no.chefe { width: 92px; height: 84px; }
  .no.chefe svg { width: 42px; height: 42px; }
  .no.trancado { background: var(--capa-2); color: var(--apagado); cursor: default; }
  .no.trancado:active { transform: none; box-shadow: 0 7px 0 rgba(0,0,0,.45); }
  .no.atual::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--cor); animation: pulso 1.4s ease-out infinite; }
  @keyframes pulso { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  .no-num { position: absolute; bottom: -4px; right: -6px; font: 16px/1 var(--vcr); background: var(--fita); color: var(--etiqueta);
    border: 1.5px solid var(--linha); border-radius: 6px; padding: 2px 5px; }
  .no-estrelas { font-size: 16px; letter-spacing: 2px; margin-top: 10px; color: var(--linha); min-height: 20px; }
  .no-estrelas b { color: var(--amarelo); font-weight: 400; }
  .balao { position: absolute; bottom: calc(100% + 14px); background: var(--etiqueta); color: var(--fita); font: 18px/1 var(--display);
    padding: 8px 12px; border-radius: 10px; white-space: nowrap; animation: flutua 1.6s ease-in-out infinite; }
  .balao::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--etiqueta); }
  @keyframes flutua { 50% { transform: translateY(-4px); } }
  .no-wrap.novo .no { animation: desbloqueio .7s cubic-bezier(.2,1.8,.4,1); }
  @keyframes desbloqueio { 0% { transform: scale(.3) rotate(-25deg); } 100% { transform: none; } }
  /* Portão das prateleiras trancadas */
  .portao-wrap { position: relative; margin: 6px -4px 26px; overflow: visible; }
  .portao { position: relative; display: block; width: 100%; border: 0; padding: 0; background: none; cursor: pointer; }
  .portao svg { display: block; width: 100%; height: auto; overflow: visible; }
  .portao .porta { transform-box: view-box; transition: none; }
  .portao .porta.esq { transform-origin: 40px 260px; }
  .portao .porta.dir { transform-origin: 300px 260px; }
  .portao .racha { opacity: 0; transition: opacity .15s; }
  .portao .cadeado-g { transform-box: fill-box; transform-origin: 50% 0; }
  .portao-dica { text-align: center; color: var(--apagado); font: 19px/1.25 var(--vcr); margin-top: 12px; padding: 0 12px; }
  .portao-dica b { color: var(--etiqueta); font-weight: 400; }
  .portao-mais { text-align: center; color: var(--linha); font: 18px/1 var(--vcr); margin-top: 18px; letter-spacing: 1px; }
  .portao.balanca { animation: balanca .4s ease-in-out; }
  @keyframes balanca { 20% { transform: rotate(-1.2deg); } 50% { transform: rotate(1deg); } 80% { transform: rotate(-.5deg); } }
  .portao.treme { animation: treme .35s linear; }
  @keyframes treme { 10%,50%,90% { transform: translate(-6px, 2px); } 30%,70% { transform: translate(6px, -2px); } }
  .portao.estoura .porta.esq { animation: portaEsq .9s cubic-bezier(.3,.1,.6,1) forwards; }
  .portao.estoura .porta.dir { animation: portaDir .9s cubic-bezier(.3,.1,.6,1) forwards; }
  @keyframes portaEsq { to { transform: translate(-150px, 120px) rotate(-55deg); opacity: 0; } }
  @keyframes portaDir { to { transform: translate(150px, 120px) rotate(55deg); opacity: 0; } }
  .portao.estoura .cadeado-g { animation: cai .7s ease-in forwards; }
  @keyframes cai { to { transform: translateY(220px) rotate(80deg); opacity: 0; } }
  .portao.estoura .corrente { animation: some .3s forwards; }
  @keyframes some { to { opacity: 0; } }
  .lasca { position: absolute; width: 10px; height: 22px; background: #7a4f2a; border: 1px solid #3b2410; border-radius: 2px; pointer-events: none; z-index: 5;
    animation: lasca .9s cubic-bezier(.2,.6,.4,1) forwards; }
  @keyframes lasca { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  .poeira { position: absolute; left: 50%; top: 70%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(200,190,170,.35); pointer-events: none;
    animation: poeira 1s ease-out forwards; }
  @keyframes poeira { to { transform: scale(9); opacity: 0; } }
  .clarao { position: fixed; inset: 0; background: var(--cor, #fff); pointer-events: none; z-index: 70; animation: clarao .6s ease-out forwards; }
  @keyframes clarao { from { opacity: .55; } to { opacity: 0; } }
  .unidade.revelar { animation: revela .7s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes revela { from { transform: scale(.6); opacity: 0; } }
  .unidade.escondida, .portao-wrap.escondida { display: none; }
  .portao-wrap.revelar { animation: revela .7s cubic-bezier(.2,1.5,.4,1) both; }
  .anuncio { text-align: center; font: 30px/1.1 var(--display); color: var(--cor); margin: 0 0 14px; animation: revela .6s cubic-bezier(.2,1.8,.4,1) both; }
  .pipoca { position: fixed; top: -50px; z-index: 69; pointer-events: none; line-height: 1; display: block; }
  .pipoca svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .no-wrap.festa .no-estrelas b { display: inline-block; animation: estrela .6s cubic-bezier(.2,1.8,.4,1) both; }
  .no-wrap.festa .no { animation: pula .5s ease-out; }
  @keyframes pula { 40% { transform: translateY(-14px) scale(1.08); } }
  .portao-wrap.quebrado { margin-bottom: 4px; }
  .portao-wrap.quebrado .portao { cursor: default; }
  /* Letreiro de cinema antigo com lâmpadas */
  .letreiro-fundo { position: fixed; inset: 0; z-index: 65; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;

   A lista completa (1000 filmes reais fora do jogo) fica em dados/iscas.json; estes são só o reserva se o arquivo não carregar. */
let DECOYS = [
  "Shrek 2", "Toy Story 2", "Carros 2", "Matrix Reloaded", "O Rei Leão (2019)", "Harry Potter e a Câmara Secreta",
  "De Volta para o Futuro Parte II", "O Mundo Perdido: Jurassic Park", "Piratas do Caribe: O Baú da Morte",
];
let DECOYS_SOLTO = new Set();

const ROUNDS = 5;
// Máximo numa partida: 5 pontos por filme + combo (+1 +2 +3 +4 acertando todas no 1º frame) = 35.
const PONTOS_MAX = () => ROUNDS * 5 + ROUNDS * (ROUNDS - 1) / 2;
// Metas de estrelas (carreira) e de patente (partida rápida): ★ 10 · ★★ 18 · ★★★ 25.
const METAS = [10, 18, 25];
const estrelasDe = pts => METAS.filter(m => pts >= m).length;

/* ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
// Normaliza texto para comparar: minúsculas, sem acento, sem pontuação, espaços únicos.
// "NÁUFRAGO", "Naufrago", "náufrago " e "Náufrago" (com acento decomposto do teclado) viram "naufrago".
const norm = s => String(s ?? "")
  .replace(/[​-‍﻿]/g, "")          // caracteres invisíveis que alguns teclados inserem
  .normalize("NFKD").replace(/[̀-ͯ]/g, "") // separa e remove acentos
  .toLowerCase()
  .replace(/&/g, " e ").replace(/[’'`´]/g, "")
  .replace(/[^a-z0-9]+/g, " ").trim();
// Versão ainda mais solta: sem espaços e sem artigo no começo ("o naufrago" = "nau frago" = "naufrago").
const solto = s => norm(s).replace(/^(o|a|os|as|um|uma|the) /, "").replace(/ /g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let MOVIES = MOVIES_EMOJI;
let ALL_TITLES = [];
let POP = {};
let DICAS = {}, EXTRAS = {};
const nivelDe = m => POP[m.id] ?? 3; // filme ainda não classificado entra no meio

async function loadMovies() {
  const showAll = new URLSearchParams(location.search).has("revisao");
  const byId = new Map(MOVIES_EMOJI.map(m => [m.id, m]));
  try {
    const get = u => fetch(u, { cache: "no-store" }).then(r => { if (!r.ok) throw r.status; return r.json(); });
    const data = await get("dados/filmes.json");
    if (showAll) data.push(...await get("dados/pendentes.json").catch(() => []));
    for (const m of data) {
      const ok = m.frames.length === 5 && m.frames.every(f => f.approved);
      if (!ok && !showAll) continue;
      byId.set(m.id, { id: m.id, title: m.title, year: m.year, aliases: m.aliases, synopsis: m.synopsis,
        frames: [...m.frames].sort((a, b) => a.order - b.order).map(f => ({ img: f.file })) });
    }
  } catch (e) { console.warn("dados/filmes.json não carregou; usando os dados emoji", e); }
  try { POP = (await fetch("dados/popularidade.json", { cache: "no-store" }).then(r => r.json())).filmes || {}; }
  catch (e) { console.warn("dados/popularidade.json não carregou; todos no nível 3", e); }
  try { const dj = await fetch("dados/dicas.json", { cache: "no-store" }).then(r => r.json()); DICAS = dj.dicas || {}; EXTRAS = dj.extras || {}; }
  catch (e) { console.warn("dados/dicas.json não carregou; sem letreiro de dica", e); }
  MOVIES = [...byId.values()];
  try { DECOYS = (await fetch("dados/iscas.json", { cache: "no-store" }).then(r => r.json())).iscas || DECOYS; }
  catch (e) { console.warn("dados/iscas.json não carregou; usando as iscas reserva", e); }
  // Isca que virou filme do catálogo (mesmo título ou apelido) sai da lista sozinha.
  const doCatalogo = new Set(MOVIES.flatMap(m => [m.title, ...m.aliases].map(solto)));
  DECOYS = DECOYS.filter(d => !doCatalogo.has(solto(d)));
  DECOYS_SOLTO = new Set(DECOYS.map(solto));
  // Ordem alfabética: se os filmes do jogo viessem primeiro, o topo da lista entregaria a resposta.
  ALL_TITLES = [...new Set([...MOVIES.map(m => m.title), ...DECOYS])].sort((a, b) => norm(a).localeCompare(norm(b)));
}

let game, movie, revealed, viewing, marks, hl = -1;

/* ===== Histórico: evita repetir filmes entre sessões (guardado só neste aparelho) =====
   Ordem de prioridade do sorteio:
     1. lançamentos: filmes que entraram no catálogo depois da última visita do jogador
     2. inéditos: nunca vistos
     3. vistos menos vezes; entre eles, os que apareceram nas últimas 3 sessões vão para o fim
   Assim ninguém repete um filme antes de passar pelo catálogo inteiro, e cada filme novo
   que você adiciona em dados/filmes.json aparece logo na próxima sessão de quem já joga. */
const HIST_KEY = "qef_historico";
const SESSOES_DE_DESCANSO = 3;
function lerHistorico() {
  let h = null;
  try { h = JSON.parse(Armazem.get(HIST_KEY)); } catch {}
  return h && h.filmes ? h : { filmes: {}, sessao: 0, conhecidos: null };
}
function salvarHistorico(h) { Armazem.set(HIST_KEY, JSON.stringify(h)); }

function priorizar(h, lancamentos, pool, qtd) {
  const chave = m => {
    const f = h.filmes[m.id];
    return [lancamentos.has(m.id) ? 0 : 1, f ? f.n : 0, f && h.sessao - f.s <= SESSOES_DE_DESCANSO ? 1 : 0, Math.random()];
  };
  const cmp = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  return pool.map(m => [chave(m), m]).sort((a, b) => cmp(a[0], b[0])).slice(0, qtd).map(x => x[1]);
}

/* Monta as 5 fitas de uma partida.
   Partida rápida: uma fita de cada nível de popularidade (1 → 5), do mais fácil ao mais difícil.
   Fase da carreira: fitas do nível da prateleira; a fase-chefe mistura 3 do nível com 2 do nível seguinte. */
function montarSessao(fase) {
  const h = lerHistorico();
  h.sessao++;
  // Lançamento = está no catálogo, o jogador já tinha jogado antes, e o filme não existia na visita anterior.
  const conhecidos = h.conhecidos ? new Set(h.conhecidos) : null;
  const lancamentos = new Set(conhecidos ? MOVIES.filter(m => !conhecidos.has(m.id) && !h.filmes[m.id]).map(m => m.id) : []);
  const escolhidos = [];
  const pegar = (nivel, qtd) => escolhidos.push(...priorizar(h, lancamentos,
    MOVIES.filter(m => nivelDe(m) === nivel && !escolhidos.includes(m)), qtd));
  if (!fase) [1, 2, 3, 4, 5].forEach(n => pegar(n, 1));
  else if (fase.chefe && fase.unidade < 5) { pegar(fase.unidade, 3); pegar(fase.unidade + 1, 2); }
  else pegar(fase.unidade, ROUNDS);
  // Se faltar filme num nível, completa com os níveis mais próximos.
  if (escolhidos.length < ROUNDS) {
    const alvo = fase ? fase.unidade : 3;
    const resto = MOVIES.filter(m => !escolhidos.includes(m)).sort((a, b) => Math.abs(nivelDe(a) - alvo) - Math.abs(nivelDe(b) - alvo));
    const perto = resto.filter(m => Math.abs(nivelDe(m) - alvo) <= Math.abs(nivelDe(resto[0] ?? m) - alvo) + 1);
    escolhidos.push(...priorizar(h, lancamentos, perto.length >= ROUNDS - escolhidos.length ? perto : resto, ROUNDS - escolhidos.length));
  }
  // Ordem: do mais popular (fácil) para o menos popular (difícil); sorteio dentro do mesmo nível.
  const fila = shuffle(escolhidos).sort((a, b) => nivelDe(a) - nivelDe(b));
  h.conhecidos = conhecidos ? [...new Set([...conhecidos, ...fila.map(m => m.id)])] : MOVIES.map(m => m.id);
  salvarHistorico(h);
  return { fila, lancamentos };
}

function marcarVisto(id) {
  const h = lerHistorico();
  const f = h.filmes[id] ||= { n: 0, s: 0 };
  f.n++; f.s = h.sessao; f.t = Date.now();
  salvarHistorico(h);
}

function progressoColecao() {
  const h = lerHistorico();
  return { vistos: MOVIES.filter(m => h.filmes[m.id]).length, total: MOVIES.length };
}


function iniciarPartida(fase = null) {
  const { fila, lancamentos } = montarSessao(fase);
  game = { fase, queue: fila, lancamentos, idx: 0, total: 0, log: [], streak: 0, bestStreak: 0, combo: 0, bestCombo: 0 };
  $("roundTotal").textContent = ROUNDS;
  $("modoLabel").textContent = fase ? `FASE ${fase.num} · META ★ ${METAS[0]} PTS` : "PARTIDA RÁPIDA";
  mostrar("gameScreen");
  startMovie();
}

function startMovie() {
  movie = game.queue[game.idx];
  marcarVisto(movie.id);
  revealed = 1; viewing = 0; marks = [];
  $("chutes").innerHTML = "";
  $("roundNo").textContent = game.idx + 1;
  $("total").textContent = game.total;
  $("guessPhase").classList.remove("hidden");
  $("resultPhase").classList.add("hidden");
  $("guessInput").value = ""; $("guessInput").disabled = false;
  $("guessBtn").disabled = true; $("skipBtn").disabled = false;
  $("scene").classList.remove("win");
  atualizarTags();
  hideSuggest();
  render("tracking");
  extrasVistas = 0;
  desenharDicas();
  if (DICAS[movie.id]) mostrarLetreiro(DICAS[movie.id]);
}

let extrasVistas = 0, pedindoExtra = false;
const PLAY_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="4" width="21" height="16" rx="4" fill="currentColor"/><path d="M10 8.5v7l6-3.5z" fill="#d9a441"/></svg>`;
function desenharDicas() {
  const dica = DICAS[movie.id], extras = EXTRAS[movie.id] || [];
  const linha = $("dicaLinha");
  linha.classList.toggle("hidden", !dica && !extras.length);
  const resta = extras.length - extrasVistas;
  linha.innerHTML = `<div class="dica-topo"><b>DICA</b>`
    + (resta > 0 ? `<button class="dica-extra" id="dicaExtraBtn" aria-label="Assistir a um anúncio para ganhar uma dica extra (${extrasVistas + 1} de ${extras.length})">${PLAY_SVG}<span>DICA EXTRA</span><small>${extrasVistas + 1}/${extras.length}</small></button>` : "")
    + `</div><div>${dica || ""}</div>`
    + extras.slice(0, extrasVistas).map((t, k) => `<div class="dica-x"><b>EXTRA ${k + 1}</b>${t}</div>`).join("");
  const btn = $("dicaExtraBtn");
  if (btn) btn.onclick = pedirDicaExtra;
}
async function pedirDicaExtra() {
  if (pedindoExtra) return;
  pedindoExtra = true;
  const btn = $("dicaExtraBtn"), alvo = movie;
  btn.disabled = true; btn.querySelector("span").textContent = "CARREGANDO...";
  const ganhou = await Anuncios.premiado();
  pedindoExtra = false;
  if (movie !== alvo) return; // a fita mudou enquanto o anúncio passava
  // Sem anúncio disponível (null), a dica sai de graça. Só fica sem dica quem fechou o vídeo antes do fim (false).
  if (ganhou === false) {
    desenharDicas();
    const b = $("dicaExtraBtn");
    if (b) { b.querySelector("span").textContent = "ASSISTA ATÉ O FIM"; b.disabled = true; setTimeout(desenharDicas, 2200); }
    return;
  }
  extrasVistas++;
  desenharDicas();
  mostrarLetreiro(EXTRAS[movie.id][extrasVistas - 1], `DICA EXTRA ${extrasVistas} DE ${EXTRAS[movie.id].length}`);
}

function mostrarLetreiro(texto, topo) {
  $("letreiroTopo").textContent = topo || `FITA ${game.idx + 1} DE ${ROUNDS}`;
  $("letreiroTexto").textContent = texto;
  const fundo = $("letreiroFundo"), placa = $("letreiro");
  // Reinicia as animações a cada filme.
  [placa, $("letreiroBtn")].forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  fundo.classList.remove("hidden");
  acenderLampadas(placa, $("lampadas"));
  som([392, 494, 587, 784], "triangle", 0.09, 0.06);
  setTimeout(() => vibrar(25), 550);
}
// Lâmpadas em volta da placa, acendendo uma a uma.
function acenderLampadas(placa, caixa, atraso = 0.55) {
  const w = placa.offsetWidth, h = placa.offsetHeight, m = 13, passo = 24;
  const pontos = [], lados = [[m, m, w - m, m], [w - m, m, w - m, h - m], [w - m, h - m, m, h - m], [m, h - m, m, m]];
  for (const [x1, y1, x2, y2] of lados) {
    const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / passo));
    for (let k = 0; k < n; k++) pontos.push([x1 + (x2 - x1) * k / n, y1 + (y2 - y1) * k / n]);
  }
  caixa.innerHTML = pontos.map(([x, y], k) =>
    `<i class="lampada ${k % 2 ? "par" : ""}" style="left:${x}px;top:${y}px;--d:${(atraso + k * 0.012).toFixed(3)}s"></i>`).join("");
}
function fecharLetreiro() {
  if ($("letreiroFundo").classList.contains("hidden")) return;
  $("letreiroFundo").classList.add("hidden");
  som([784, 1047], "square", 0.05, 0.05);
}
$("letreiroFundo").onclick = fecharLetreiro;

function worth() { return Math.max(0, 6 - revealed); }

/* effect: "tracking" (frame novo), "error" (chute errado) ou nada */
function render(effect) {
  const f = movie.frames[viewing];
  const live = viewing === revealed - 1;
  const osd = `<span class="osd tl ${effect === "error" ? "err" : ""}">${effect === "error" ? "✕ ERRO" : live ? "► PLAY" : "❚❚ PAUSE"}</span>`
    + `<span class="osd tr">FRAME ${String(viewing + 1).padStart(2, "0")}</span><span class="osd bl">SP</span>`
    + (game.lancamentos?.has(movie.id) ? `<span class="osd br lanc">★ LANÇAMENTO</span>` : "");
  const scene = $("scene");
  scene.innerHTML = osd + (f.img
    ? `<img src="${f.img}" alt="Frame ${viewing + 1} do filme">`
    : `<div class="emoji">${f.e}</div><div class="cap">${f.t}</div>`);
  scene.classList.toggle("zoomable", !!f.img);
  scene.title = f.img ? "Toque para ver em tela cheia" : "";
  scene.classList.remove("tracking", "shake");
  void scene.offsetWidth; // reinicia a animação
  if (effect === "tracking") scene.classList.add("tracking");
  if (effect === "error") {
    scene.classList.add("shake");
    clearTimeout(render.t);
    render.t = setTimeout(() => { const o = scene.querySelector(".osd.err"); if (o) { o.classList.remove("err"); o.textContent = "► PLAY"; } }, 1000);
  }
  $("worth").textContent = worth();
  const dots = $("dots"); dots.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const b = document.createElement("button");
    b.className = "dot" + (i < revealed ? " seen" : "") + (i === viewing ? " active" : "") + (marks[i] ? " " + marks[i] : "");
    b.textContent = i + 1;
    b.disabled = i >= revealed;
    b.onclick = () => { viewing = i; render(); };
    dots.appendChild(b);
  }
}

/* --- palpite --- */
function distancia(a, b) { // Levenshtein: quantas letras inserir, apagar ou trocar
  let ant = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const at = [i];
    for (let j = 1; j <= b.length; j++)
      at[j] = Math.min(ant[j] + 1, at[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    ant = at;
  }
  return ant[b.length];
}

function isCorrect(guess) { return acertaFilme(movie, guess); }

function acertaFilme(filme, guess) {
  const g = solto(guess);
  if (!g) return false;
  const alvos = [filme.title, ...filme.aliases].map(solto);
  if (alvos.includes(g)) return true;
  // Se o chute é exatamente o título de OUTRO filme do catálogo, está errado mesmo.
  if (MOVIES.some(m => m !== filme && [m.title, ...m.aliases].some(t => solto(t) === g))) return false;
  // Idem para as iscas do autocomplete ("Shrek 2" não vira "Shrek" pela tolerância).
  if (DECOYS_SOLTO.has(g)) return false;
  // Tolerância a erro de digitação e ao corretor do teclado (ex.: "naufragio" → "Náufrago"):
  // 1 letra em títulos de 5 a 9 letras, 2 letras a partir de 10. Títulos curtos ("Up", "Coco") exigem exatidão.
  const tolerancia = t => t.length >= 10 ? 2 : t.length >= 5 ? 1 : 0;
  return alvos.some(a => distancia(g, a) <= tolerancia(a));
}

function submitGuess() {
  const g = $("guessInput").value.trim();
  if (!g) return;
  if (isCorrect(g)) {
    marks[revealed - 1] = "ok";
    // Segura a tela por um instante: o jogador vê a TV "acender" antes do placar.
    $("guessInput").disabled = true; $("guessBtn").disabled = true; $("skipBtn").disabled = true; hideSuggest();
    $("guessInput").blur();
    const scene = $("scene");
    scene.classList.remove("tracking", "shake", "win"); void scene.offsetWidth; scene.classList.add("win");
    const o = scene.querySelector(".osd.tl"); if (o) { o.className = "osd tl win"; o.textContent = "★ ACERTOU"; }
    efeito(worth() >= 4 ? "acertoGrande" : "acerto");
    return setTimeout(() => endGuess(true), 750);
  }
  marks[revealed - 1] = "bad";
  // Mostra o que foi registrado: se o teclado trocou a palavra, o jogador percebe na hora.
  const chip = document.createElement("span"); chip.textContent = "✕ " + g;
  $("chutes").appendChild(chip);
  efeito("erro");
  advance(true);
}

function advance(wasWrong) {
  $("guessInput").value = ""; $("guessBtn").disabled = true; hideSuggest();
  if (revealed >= 5) return endGuess(false);
  revealed++; viewing = revealed - 1;
  render(wasWrong ? "error" : "tracking");
  const wb = document.querySelector(".worthBox"); wb.classList.remove("drop"); void wb.offsetWidth; wb.classList.add("drop");
  if (wasWrong) setTimeout(() => $("scene").classList.add("tracking"), 350);
  atualizarTags();
}

function atualizarTags() {
  const tags = [];
  if (game.streak >= 2) tags.push(`🔥 ${game.streak} SEGUIDAS`);
  // O combo só vale enquanto o jogador está no 1º frame: a tensão de "não posso errar".
  if (game.combo >= 1 && revealed === 1) tags.push(`⚡ COMBO x${game.combo + 1} VALENDO`);
  $("streakTag").textContent = tags.length ? " · " + tags.join(" · ") : "";
  $("streakTag").classList.toggle("hidden", !tags.length);
}

function skip() { marks[revealed - 1] = "skip"; advance(); }

function endGuess(won) {
  const pts = won ? worth() : 0;
  game.total += pts;
  game.current = { title: movie.title, pts, marks: marks.slice() };
  game.log.push(game.current);
  render();
  $("guessPhase").classList.add("hidden");
  $("resultPhase").classList.remove("hidden");
  const lostStreak = !won && game.streak >= 2 ? game.streak : 0;
  game.streak = won ? game.streak + 1 : 0;
  game.bestStreak = Math.max(game.bestStreak, game.streak);
  const frame = revealed; // em qual frame acertou (1 = o mais difícil)
  // Combo: acertos seguidos no 1º frame. Do 2º em diante rende bônus crescente (+1, +2, +3…).
  const comboAntes = game.combo;
  game.combo = won && frame === 1 ? game.combo + 1 : 0;
  game.bestCombo = Math.max(game.bestCombo, game.combo);
  const comboBonus = game.combo >= 2 ? game.combo - 1 : 0;
  game.total += comboBonus; game.current.combo = comboBonus;
  const comboQuebrado = !game.combo && comboAntes >= 2 ? comboAntes : 0;
  const [comboTitulo, comboFrase] = COMBOS[game.combo] || COMBOS.mais(game.combo);
  const comboHtml = comboBonus
    ? `<div class="combo c${Math.min(game.combo, 5)}"><div class="combo-n">COMBO x${game.combo}</div>
         <div class="combo-msg">${comboTitulo}</div><div class="muted">${comboFrase}</div>
         <div class="combo-bonus">+${comboBonus} DE COMBO</div></div>`
    : comboQuebrado ? `<div class="combo-quebrado">⚡ COMBO x${comboQuebrado} QUEBRADO</div>` : "";
  $("verdict").innerHTML = won
    ? `<div class="win-box"><span class="stamp ok">${TITULOS[frame]}</span>
         <div class="gain pop">+<span id="gainN">0</span></div>
         <div class="label">ACERTOU NO FRAME ${frame} DE 5${game.streak >= 2 ? ` · <span style="color:var(--laranja)">🔥 ${game.streak} SEGUIDAS</span>` : ""}</div>${comboHtml}</div>`
    : `<span class="stamp bad">FITA MASTIGADA…</span>${lostStreak ? `<div class="label" style="margin-bottom:12px">A SEQUÊNCIA DE ${lostStreak} ACABOU</div>` : ""}${comboHtml}`;
  $("answerLine").innerHTML = "";
  $("answerLine").append(movie.title, Object.assign(document.createElement("small"), { textContent: ` (${movie.year})` }));
  // Tira com os 5 frames: o que você viu e o que nem precisou ver.
  $("strip").innerHTML = movie.frames.map((f, i) => {
    const cls = marks[i] || (i >= revealed ? "extra" : "");
    return `<figure class="${cls}" style="animation-delay:${i * 70}ms">${f.img ? `<img src="${f.img}" alt="">` : ""}<span>${i + 1}</span></figure>`;
  }).join("");
  $("stripInfo").textContent = won
    ? (frame < 5 ? `VOCÊ NEM PRECISOU DE ${5 - frame} FRAME${5 - frame > 1 ? "S" : ""}` : "NO LIMITE!")
    : "ERAM ESTES OS 5 FRAMES";
  if (won) {
    contarAte($("gainN"), pts);
    confete(pts * 8 + comboBonus * 30);
    if (comboBonus) efeito("combo", game.combo);
    bump($("total").parentElement);
  }
  $("synopsis").textContent = movie.synopsis || "";
  $("nextBtn").textContent = game.idx + 1 < ROUNDS ? "Próxima fita ►" : (game.fase ? "Ver resultado ►" : "Fim da sessão ►");
  $("total").textContent = game.total;
  // Sem foco automático: no celular o teclado abriria e esconderia a comemoração.
  document.activeElement?.blur(); scrollTo({ top: 0 });
}

/* --- autocomplete --- */
function updateSuggest() {
  const q = norm($("guessInput").value);
  $("guessBtn").disabled = !q;
  const ul = $("suggest");
  if (q.length < 2) return hideSuggest();
  // Primeiro os que contêm o que foi digitado (ignorando acento, maiúscula e espaço);
  // se não achar nada, os mais parecidos (pega erro de digitação: "nafrago" → Náufrago).
  const qs = solto(q);
  let items = ALL_TITLES.filter(t => norm(t).includes(q) || solto(t).includes(qs));
  if (!items.length && qs.length >= 4) items = ALL_TITLES
    .map(t => [t, Math.min(...[t, ...(MOVIES.find(m => m.title === t)?.aliases || [])].map(x => distancia(qs, solto(x).slice(0, qs.length + 1))))])
    .filter(([, d]) => d <= (qs.length >= 8 ? 2 : 1)).sort((a, b) => a[1] - b[1]).map(([t]) => t);
  // Quem começa com o que foi digitado vem antes; o resto fica em ordem alfabética (jogo e isca misturados).
  const comeca = t => norm(t).startsWith(q) || solto(t).startsWith(qs) ? 0 : 1;
  items = items.sort((a, b) => comeca(a) - comeca(b)).slice(0, 8);
  if (!items.length) return hideSuggest();
  hl = -1;
  ul.innerHTML = items.map(t => `<li>${t}</li>`).join("");
  [...ul.children].forEach(li => li.onmousedown = e => { e.preventDefault(); pick(li.textContent); });
  ul.classList.remove("hidden");
}

let actx;
function som(notas, onda = "square", passo = 0.085, vol = 0.07) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    for (const f of notas) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = onda; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + passo * 1.9);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + passo * 2);
      t += passo;
    }
  } catch {}
}
function vibrar(ms) {
  if (Nativo?.Haptics) Nativo.Haptics.vibrate({ duration: ms }).catch(() => {});
  else navigator.vibrate?.(ms);
}
function efeito(tipo, n = 0) {
  if (tipo === "combo") {
    // Fanfarra mais aguda e mais longa a cada nível; vibração com um pulso por nível.
    const sobe = Math.pow(2, (n - 2) * 2 / 12);
    const base = [523, 659, 784, 1047, 784, 1047, 1319, 1568].slice(0, 4 + Math.min(n, 4));
    setTimeout(() => som(base.map(f => f * sobe), "square", 0.07, 0.08), 250);
    for (let i = 0; i < Math.min(n, 6); i++) setTimeout(() => vibrar(60), 250 + i * 130);
    return;
  }
  if (tipo === "acertoGrande") { som([523, 659, 784, 1047, 1319, 1568]); vibrar(70); setTimeout(() => vibrar(120), 140); }
  else if (tipo === "acerto") { som([523, 659, 784, 1047]); vibrar(90); }
  else if (tipo === "bonus") { som([784, 1047], "triangle", 0.08, 0.09); vibrar(40); }
  else if (tipo === "erro") { som([196, 147], "sawtooth", 0.11, 0.05); vibrar(35); }
}

/* ===== Anúncios (AdMob) =====
   Banner fixo no rodapé + anúncio de tela cheia (intersticial) ao completar uma fase (da fase 2 em diante).
   Só no app; no navegador fica o retângulo "INTERVALO COMERCIAL" de exemplo.
   TESTE = true usa os IDs de teste do Google (pode clicar à vontade). No Android já estão os IDs reais;
   quando criar o app iOS no AdMob, coloque os IDs dele aqui e no Info.plist. Clicar no próprio anúncio
   de verdade bloqueia a conta. */
const Anuncios = (() => {
  const ios = window.Capacitor?.getPlatform?.() === "ios";
  // Android já usa os blocos reais da conta AdMob. O iOS ainda não tem app no AdMob: fica com os de teste do Google.
  const TESTE = ios;
  const IDS = TESTE
    ? { banner: ios ? "ca-app-pub-3940256099942544/2934735716" : "ca-app-pub-3940256099942544/6300978111",
        tela:   ios ? "ca-app-pub-3940256099942544/4411468910" : "ca-app-pub-3940256099942544/1033173712",
        premio: ios ? "ca-app-pub-3940256099942544/1712485313" : "ca-app-pub-3940256099942544/5224354917" }
    : { banner: "ca-app-pub-1820598732480620/5895138041",  // Rodape
        tela:   "ca-app-pub-1820598732480620/2363794987",  // Fim de fase
        premio: "ca-app-pub-1820598732480620/2196274021" }; // Dica extra
  // Aparelhos do desenvolvedor recebem anúncio de teste mesmo com os IDs reais (clicar no próprio anúncio real bloqueia a conta).
  const MEUS_APARELHOS = ["AC3AE96FF1A585701D6A7E49DFB6FC41"]; // Galaxy A10s do Evandro
  // Quando: como no Duolingo, ao completar uma fase da carreira, a partir da fase 2 (ver fimDeFase).
  // A fase 1 e a partida rápida não mostram tela cheia, nem fase em que o jogador não passou.
  const A = Nativo?.AdMob;
  let pronto = false;
  const carregar = () => A?.prepareInterstitial({ adId: IDS.tela, isTesting: TESTE }).catch(() => {});
  let premioPronto = false;
  const carregarPremio = () => A?.prepareRewardVideoAd({ adId: IDS.premio, isTesting: TESTE })
    .then(() => premioPronto = true).catch(() => { premioPronto = false; });
  // Banner: se o AdMob não tiver anúncio agora (comum com conta nova), tenta de novo a cada minuto.
  // Enquanto não houver banner, o rodapé não reserva espaço.
  let bannerTimer = null;
  const alturaBanner = h => document.body.style.setProperty("--banner", (h || 0) + "px");
  const tentarBanner = () => {
    clearTimeout(bannerTimer);
    A.showBanner({ adId: IDS.banner, adSize: "ADAPTIVE_BANNER", position: "BOTTOM_CENTER", margin: 0, isTesting: TESTE })
      .catch(() => { alturaBanner(0); bannerTimer = setTimeout(tentarBanner, 60000); });
  };
  async function iniciar() {
    if (!A) return;
    document.body.classList.add("com-anuncio");
    alturaBanner(0);
    try {
      await A.initialize({ initializeForTesting: true, testingDevices: MEUS_APARELHOS }); // só registra os aparelhos de teste
    } catch (e) { console.warn("AdMob não iniciou", e); return; }
    A.addListener("bannerAdSizeChanged", t => alturaBanner(t?.height));
    A.addListener("bannerAdLoaded", () => clearTimeout(bannerTimer));
    A.addListener("bannerAdFailedToLoad", e => {
      console.warn("Banner sem anúncio", JSON.stringify(e));
      alturaBanner(0); clearTimeout(bannerTimer); bannerTimer = setTimeout(tentarBanner, 60000);
    });
    A.addListener("interstitialAdLoaded", () => pronto = true);
    A.addListener("interstitialAdFailedToLoad", () => { pronto = false; setTimeout(carregar, 60000); });
    // Cada formato carrega por conta própria: a falta de banner não impede a tela cheia nem a dica extra.
    tentarBanner();
    carregar();
    carregarPremio();
  }
  // Chamado ao tocar num botão da tela de fim: mostra a tela cheia (se for a hora) e depois segue.
  function intervalo(seguir) {
    if (!A || !pronto) return seguir(); // anúncio ainda não carregou: não segura o jogador
    pronto = false;
    let foi = false;
    const continuar = () => { if (foi) return; foi = true; seguir(); carregar(); };
    const h1 = A.addListener("interstitialAdDismissed", () => { h1.then?.(h => h.remove()); continuar(); });
    const h2 = A.addListener("interstitialAdFailedToShow", () => { h2.then?.(h => h.remove()); continuar(); });
    A.showInterstitial().catch(continuar);
  }
  // Envolve os botões da tela de fim de partida.
  function nosBotoes() {
    for (const id of ["endPri", "endSec"]) { const ir = $(id).onclick; $(id).onclick = () => intervalo(ir); }
  }
  // Anúncio premiado (dica extra). Resolve true só se o jogador assistiu até ganhar a recompensa.
  // No navegador, mostra um anúncio de mentira de 3 segundos para dar para testar.
  function premiado() {
    // Versão web publicada (montar-web.mjs): sem anúncio nenhum, a dica extra sai direto.
    if (!A && document.documentElement.dataset.versao === "web") return Promise.resolve(true);
    if (!A) return new Promise(res => {
      const el = document.createElement("div"); el.className = "anuncio-falso";
      document.body.appendChild(el);
      let n = 3; const tique = () => { el.innerHTML = `ANÚNCIO DE EXEMPLO<br><small>(no app aparece um vídeo de verdade)</small><br>${n}`;
        if (n-- <= 0) { el.remove(); res(true); } else setTimeout(tique, 1000); };
      tique();
    });
    // Resolve true (assistiu), false (fechou antes do fim) ou null (não havia anúncio para mostrar).
    return new Promise(async res => {
      if (!premioPronto) await Promise.race([carregarPremio(), new Promise(r => setTimeout(r, 6000))]);
      if (!premioPronto) { carregarPremio(); return res(null); }
      premioPronto = false;
      let ganhou = false, acabou = false;
      const hs = [];
      const fim = (semAnuncio) => { if (acabou) return; acabou = true;

      hs.push(A.addListener("onRewardedVideoAdReward", () => ganhou = true));
      hs.push(A.addListener("onRewardedVideoAdDismissed", () => fim()));
      hs.push(A.addListener("onRewardedVideoAdFailedToShow", () => fim(true)));
      A.showRewardVideoAd().then(r => { if (r) ganhou = true; }).catch(() => fim(true));
    });
  }
  return { iniciar, nosBotoes, premiado };
})();
/* ===== Armazenamento do progresso (histórico de filmes e recorde) =====
   No app: @capacitor/preferences (SharedPreferences no Android, UserDefaults no iOS), que o
   sistema não apaga para liberar espaço, ao contrário do localStorage do WebView.
   No navegador: localStorage. As leituras saem de um cache em memória carregado na abertura,
   então o resto do jogo continua síncrono; as gravações vão para o disco em segundo plano. */
const RECORDE_KEY = "qef_recorde";
const Armazem = {
  cache: {},
  async carregar(chaves) {
    const P = Nativo?.Preferences;
    for (const k of chaves) {
      let v = null;
      try {
        if (P) {
          v = (await P.get({ key: k })).value ?? null;
          if (v === null) { // migração: quem já jogava a versão antiga não perde o progresso
            try { v = localStorage.getItem(k); } catch {}
            if (v !== null) await P.set({ key: k, value: v });
          }
        } else v = localStorage.getItem(k);
      } catch {}
      this.cache[k] = v;
    }
  },
  get(k) { return this.cache[k] ?? null; },
  set(k, v) {
    v = String(v); this.cache[k] = v;
    if (Nativo?.Preferences) Nativo.Preferences.set({ key: k, value: v }).catch(() => {});
    else try { localStorage.setItem(k, v); } catch {}
  },
  remove(k) {
    delete this.cache[k];
    Nativo?.Preferences?.remove({ key: k }).catch(() => {});
    try { localStorage.removeItem(k); } catch {}
  },
};

    $("endSec").onclick = () => iniciarPartida(f);
  } else {
    $("endPri").textContent = "Tentar de novo";
    $("endPri").onclick = () => iniciarPartida(f);
    $("endSec").textContent = "Caminho";
    $("endSec").onclick = () => abrirCaminho();
  }
  if (passou && f.num >= 2) Anuncios.nosBotoes(); // tela cheia ao sair da tela de fase completa
  $("shareText").textContent = `📼 Qual é o Filme? · Fase ${f.num} — ${game.total}/${PONTOS_MAX()} pts ${"★".repeat(est)}${"☆".repeat(3 - est)}${extras}\n` + lines.join("\n");
}

async function iniciar() {
  await Promise.all([loadMovies(), Armazem.carregar([HIST_KEY, RECORDE_KEY, CARREIRA_KEY])]);
  // Para testes: abra com ?zerar=1 para apagar histórico, recorde e carreira deste aparelho.
  if (new URLSearchParams(location.search).has("zerar")) [HIST_KEY, RECORDE_KEY, CARREIRA_KEY].forEach(k => Armazem.remove(k));
  abrirInicio();
  Anuncios.iniciar();
}
iniciar();
</script>
